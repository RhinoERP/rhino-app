<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0567b4">
    <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font:
        600 1.25rem system-ui,
        sans-serif;
      text-align: center;
    }
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      margin: 0 auto 1rem;
      border: 4px solid #0567b4;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png">
    <title>Rhinos · Acceso offline</title>
    <script>
    "use strict";
    // Keep the installed start URL stable, with a single precached offline UI.
    window.location.replace("/~offline");
    </script>
  </head>
  <body>
    <main role="status">
      <div class="spinner" aria-hidden="true"></div>Abriendo Rhinos…
    </main>
    <noscript>
      <a href="/~offline">Abrir Rhinos sin conexión</a>
    </noscript>
  </body>
</html>
